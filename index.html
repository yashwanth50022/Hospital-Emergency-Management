<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MED-WEB CONNECT AND CURE - Patient Management</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('Background.jpg') center/cover fixed;
            background-color: #e8f4f8;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: grey;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .page {
            display: none;
            padding: 40px;
        }

        .page.active {
            display: block;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 1em;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: grey;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            background: grey;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .emergency-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1.2em;
            margin: 20px 0;
        }

        .critical { background: #ff4757; color: white; }
        .high { background: #ff6348; color: white; }
        .medium { background: #ffa502; color: white; }
        .low { background: #26de81; color: white; }

        .patient-summary {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .patient-summary h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .summary-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .summary-item strong {
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin: 30px 0;
        }

        .chart-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
        }

        .chart-box h3 {
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }

        .doctors-section {
            margin-top: 30px;
        }

        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .doctor-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .doctor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .doctor-card.available {
            border-color: #26de81;
            background: linear-gradient(135deg, #f8fff9 0%, #e8f8f5 100%);
        }

        .doctor-card.busy {
            border-color: #ff6348;
            background: linear-gradient(135deg, #fff8f8 0%, #ffebee 100%);
            opacity: 0.7;
            cursor: not-allowed;
        }

        .doctor-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .status-available {
            background: #26de81;
            color: white;
        }

        .status-busy {
            background: #ff6348;
            color: white;
        }

        .doctor-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin: 10px 0;
        }

        .doctor-specialty {
            color: green;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .doctor-experience {
            color: #666;
            font-size: 0.9em;
        }

        .assign-btn {
            width: 100%;
            margin-top: 15px;
            background: #26de81;
            padding: 10px;
            font-size: 1em;
        }

        .assign-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .back-btn {
            background: #6c757d;
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            .doctors-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MED-WEB CONNECT AND CURE</h1>
            <p>Advanced Patient Management & Doctor Allocation System</p>
        </div>

        <!-- Page 1: Patient Registration -->
        <div id="page1" class="page active">
            <h2 style="color: grey; margin-bottom: 30px;">Patient Registration</h2>
            <form id="patientForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="age">Age *</label>
                        <input type="number" id="age" min="0" max="150" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="gender">Gender *</label>
                        <select id="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="bloodGroup">Blood Group</label>
                        <select id="bloodGroup">
                            <option value="">Select Blood Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bp">Blood Pressure (mmHg) *</label>
                        <input type="text" id="bp" placeholder="e.g., 120/80" required>
                    </div>
                    <div class="form-group">
                        <label for="heartRate">Heart Rate (bpm) *</label>
                        <input type="number" id="heartRate" min="30" max="250" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="temperature">Body Temperature (°F) *</label>
                        <input type="number" id="temperature" step="0.1" min="90" max="115" required>
                    </div>
                    <div class="form-group">
                        <label for="oxygenLevel">Oxygen Saturation (%) *</label>
                        <input type="number" id="oxygenLevel" min="50" max="100" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="respiratoryRate">Respiratory Rate (breaths/min)</label>
                        <input type="number" id="respiratoryRate" min="5" max="60">
                    </div>
                    <div class="form-group">
                        <label for="painLevel">Pain Level (0-10)</label>
                        <input type="number" id="painLevel" min="0" max="10">
                    </div>
                </div>

                <div class="form-group">
                    <label for="symptoms">Symptoms *</label>
                    <textarea id="symptoms" rows="3" placeholder="Describe the symptoms..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="medicalHistory">Medical History</label>
                    <textarea id="medicalHistory" rows="2" placeholder="Any relevant medical history..."></textarea>
                </div>

                <button type="submit" class="btn">Assess Emergency & Continue</button>
            </form>
        </div>

        <!-- Page 2: Patient Dashboard & Doctor Allocation -->
        <div id="page2" class="page">
            <h2 style="color: grey; margin-bottom: 20px;">Patient Dashboard & Doctor Allocation</h2>
            
            <div class="patient-summary">
                <h3>Patient Information</h3>
                <div id="emergencyLevel"></div>
                <div class="summary-grid" id="patientSummary"></div>
            </div>

            <div class="charts-container">
                <div class="chart-box">
                    <h3>Vital Signs Overview</h3>
                    <canvas id="vitalsChart"></canvas>
                </div>
                <div class="chart-box">
                    <h3>Health Indicators</h3>
                    <canvas id="healthChart"></canvas>
                </div>
            </div>

            <div class="doctors-section">
                <h3 style="color: grey; margin-bottom: 20px;">Available Doctors</h3>
                <div class="doctors-grid" id="doctorsGrid"></div>
            </div>

            <button class="btn back-btn" onclick="goBack()">Back to Registration</button>
        </div>
        <!-- Page 3: Doctor Registration (Add after page2) -->
        <div id="page3" class="page">
            <h2 style="color: grey; margin-bottom: 20px;">Doctor Registration</h2>
            <form id="doctorForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="doctorName">Full Name</label>
                        <input type="text" id="doctorName" required>
                    </div>
                    <div class="form-group">
                        <label for="doctorSpecialty">Specialty</label>
                        <input type="text" id="doctorSpecialty" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="doctorExperience">Experience (years)</label>
                        <input type="number" id="doctorExperience" min="0" max="50" required>
                    </div>
                    <div class="form-group">
                        <label for="doctorId">Doctor ID</label>
                        <input type="number" id="doctorId" min="1" max="100" required>
                    </div>
                </div>
                <button type="submit" class="btn">Add Doctor</button>
                <button type="button" class="btn back-btn" onclick="goToPatients()">Back to Patients</button>
            </form>
        </div>

        <!-- Update navigation buttons -->
        <script>
        function goToDoctors() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.remove('active');
            document.getElementById('page3').classList.add('active');
        }

        function goToPatients() {
            document.getElementById('page3').classList.remove('active');
            document.getElementById('page1').classList.add('active');
        }
        </script>

    </div>

    <script src="app.js"></script>
</body>
</html>
